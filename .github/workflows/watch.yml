name: OpenAmer Wachhund

on:
  schedule:
    # alle 6 Stunden: 02:00, 08:00, 14:00, 20:00 UTC
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:      # manuell ausloesbar

permissions:
  contents: write

jobs:
  wachen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo holen
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wachhund laufen lassen
        run: python watch.py

      - name: Stand zurueckschreiben
        run: |
          if [ -f watch_stand.json ]; then
            git config user.name "OpenAmer Wachhund"
            git config user.email "openamer-max@proton.me"
            git add watch_stand.json watch.log
            git diff --quiet && git diff --staged --quiet || \
              git commit -m "chore: Messwerte $(date -u +%Y-%m-%d)"
            git push
          fi
        continue-on-error: true
